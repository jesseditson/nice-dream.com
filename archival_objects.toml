# This file is used to define the objects available on your site.

[about]
body = "markdown"

[lunch]
sample_menu = "upload"

[dinner]
sample_menu = "upload"
blurb = "markdown"

[business]
name = "string"
description = "string"
street_address = "string"
locality = "string"
region = "string"
postal_code = "string"
country = "string"
phone = "string"
# free text, e.g. "Japanese, Californian"
cuisine = "string"
# dollar signs ("$" to "$$$$") or a range like "$15-40"
price_range = "string"
hours_note = "string"

# days uses schema.org openingHours shorthand (Mo Tu We Th Fr Sa Su, ranges like Fr-Sa); opens/closes are 24h HH:MM, blank opens means closed
[business.hours]
label = "string"
days = "string"
opens = "string"
closes = "string"
