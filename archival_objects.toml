# This file is used to define the objects available on your site.

[about]
body = "markdown"

[lunch]
sample_menu = "upload"

[dinner]
sample_menu = "upload"
blurb = "markdown"
blurb_note = "markdown"
# Reservations — carriers/reservations and pages/reservations.liquid both read these.
# minutes between seatings
slot_minutes = "number"
# how long a booking holds its table, in minutes
hold_minutes = "number"
# how many service weekends ahead the form offers
weekends_ahead = "number"
# 2-tops are numbered 1..two_tops and combine in adjacent pairs (1/2, 3/4, …) for parties of 3–4
two_tops = "number"
# the 2-top seated first on an empty night; later bookings spread out from it
first_table = "number"
# how many dedicated 4-tops the room has (0 until they arrive); parties of 3–4 take one before combining 2-tops
four_tops = "number"
# the table number of the first 4-top; the rest count up from it
four_top_start = "number"
# communal tables take parties of 5 up to max_party
communal_tables = "number"
# the largest party the form accepts
max_party = "number"
# parties of this size or more see large_party_notice before booking and are told we'll reach out to confirm
large_party_min = "number"
large_party_notice = "markdown"
# the whole JSON key of a Google service account with the Sheets API enabled, shared on the spreadsheet as an Editor
google_service_account = "secret"
# the id from the spreadsheet's URL: docs.google.com/spreadsheets/d/<id>/edit
reservations_sheet_id = "secret"

# seating windows; days uses the same shorthand as business.hours, first/last are the first and last seating as 24h HH:MM
[dinner.seatings]
days = "string"
first = "string"
last = "string"

[business]
name = "string"
description = "string"
street_address = "string"
locality = "string"
region = "string"
postal_code = "string"
country = "string"
phone = "string"
# free text, e.g. "Japanese, Californian"
cuisine = "string"
# dollar signs ("$" to "$$$$") or a range like "$15-40"
price_range = "string"
hours_note = "string"

# days uses schema.org openingHours shorthand (Mo Tu We Th Fr Sa Su, ranges like Fr-Sa); opens/closes are 24h HH:MM, blank opens means closed
[business.hours]
label = "string"
days = "string"
opens = "string"
closes = "string"
