title = "Footprints on the Moon"
also_known_as = "Footprints · Le Orme"
starts = 2026-12-01T18:00:00.0
poster_alt = "Footprints poster: the title in yellow over blue squares, a woman in a yellow dress reaching out, and a high-contrast portrait of Florinda Bolkan"
synopsis = """
In the most criminally underseen giallo of the ‘70s, Florinda Bolkan (_A Lizard in a Woman’s Skin_, _Flavia the Heretic_) stars as a freelance translator who wakes one morning missing all memory of her past three days. But will a trail of odd clues lead her to a place where perception and identity are never what they seem? Nicoletta Elmi (_Deep Red_), Evelyn Stewart (_The Sweet Body of Deborah_), Lila Kedrova (_The Tenant_) and Klaus Kinski co-star in this “visually stunning gem” (Mondo Digital), directed by Luigi Bazzoni (_The Fifth Cord_) with cinematography by three-time Oscar winner Vittorio Storaro (_The Bird with the Crystal Plumage_), now scanned in 4K from the original camera negatives.

> “Psychedelically haunting… An existentialist adventure that combines the narrative mystery of _Solaris_ with the vivid visions of Argento.”
>
> — _Electric Sheep Magazine_

> “Seek it out and unravel its mystery… One of the most unique and overlooked Italian films of the ‘70s.”
>
> — _Moon in the Gutter_
"""
programmer_note = """
Like all Italian mystery-thrillers (Giallos) of the era, expect melodrama, campy over-acting, iconic English-dubbing, stunning wide shots, stylish lighting, a real exploration & celebration of place, and a hypnotic score.

*Footprints on the Moon* stands out from many of these movies though as it leaves you with more questions than answers. This wealth of ambiguity will allow us to really sit back and investigate: what was actually going on there?
"""
