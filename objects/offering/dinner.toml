title = "Dinner"
statement = """
Highly variable, our dinner menu - which shifts week to week (even day to day), is a snapshot in time celebrating our current micro-season. Japanese aesthetics and techniques meet Californian sensibilities. Full cocktail, spirits, and sake menus are available at all tables.
"""
