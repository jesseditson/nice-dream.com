**A bit about us:**

Nice Dream is the latest chapter of Nice Dream Ices — the beloved Joshua Tree Farmers Market booth offering hyper- seasonal, peak-produce-driven ice creams &amp; sorbets.

With the founding of Nice Dream Ices, it was Coral and Trevor’s nice dream (get it) to return
the sweetness they found to their newfound desert community. It remains our goal to this day —
to bring lightness, joy, and care to someone else’s day.

At our flagship location, we now also offer multi-roaster coffee &amp; multi-varietal matcha
programs, local &amp; heirloom grain-focused pastries, sustainably-sourced seafood-driven
lunch &amp; dinner menus with Japanese aesthetics and Californian sensibilities, and a
cocktail bar that will change everything you knew to be true about cocktails. Whew, what a
mouthful.


TL;DR — technique 🤝 seasonality.

Thoughtful sourcing and cooking with the seasons remains at the heart of everything we do at
Nice Dream. We can only pull off great food and drink magic because of our amazing partners:
Gaytan Family Farms, Nest Farm, T&D Farms, JH Family Ranch, Wong Farms, E-Fish, Browne Trading, The Rice Factory, Dorothea Coffee, Push x Pull, Little Wolf Coffee, Botz
Coffee, Sey Coffee, April Coffee Roasters, Kettl Tea, Moka Origins, Heilala Vanilla.

